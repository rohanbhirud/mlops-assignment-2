name: MLOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: DVC Repro (Train Model)
      run: |
        # Configure DVC to not need a remote for local repro
        dvc config core.analytics false
        # We need to recreate the dvc file since we are in a fresh environment
        # and don't have access to your local windows dvc-storage
        # In a real scenario, you'd pull from S3 here.
        # For this assignment CI, we'll just run the full pipeline from scratch.
        dvc repro

    - name: Run Tests
      run: |
        pytest tests/

    - name: Start Local Registry
      run: |
        docker run -d -p 5000:5000 --restart=always --name registry registry:2

    - name: Build and Push to Local Registry
      run: |
        # Build image
        docker build -t localhost:5000/mlops-assignment-2:latest .
        
        # Push to local registry
        docker push localhost:5000/mlops-assignment-2:latest
        
        # Verify push
        curl http://localhost:5000/v2/_catalog
